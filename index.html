<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>筋トレ記録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <!-- 画面1: 記録入力 -->
  <section id="screen-record" class="screen" aria-label="記録">
    <header class="top">
      <h1>記録</h1>
      <label class="date-field">
        <span class="visually-hidden">日付</span>
        <input type="date" id="date">
      </label>
    </header>

    <div class="block">
      <h2 class="block-title">種目</h2>
      <div id="exercise-list" class="chips"></div>
      <p id="exercise-empty" class="hint" hidden>まず「＋追加」で種目を作ってください。</p>
    </div>

    <div id="entry" class="block card" hidden>
      <div class="entry-head">
        <div>
          <h2 id="entry-name" class="entry-name"></h2>
          <p id="entry-meta" class="entry-meta"></p>
        </div>
      </div>
      <ol id="set-list" class="sets"></ol>
      <button type="button" id="add-set" class="btn btn-ghost">＋セット追加</button>
      <p id="entry-error" class="error" role="alert" hidden></p>
    </div>

    <div class="save-bar" id="save-bar" hidden>
      <button type="button" id="save" class="btn btn-primary">保存</button>
    </div>
  </section>

  <!-- 画面2: グラフ(ステップ5で作る) -->
  <section id="screen-graph" class="screen" aria-label="グラフ" hidden>
    <header class="top">
      <h1>グラフ</h1>
    </header>
    <p class="hint">準備中です。</p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="tabbar" aria-label="画面の切り替え">
  <button type="button" class="tab is-active" data-screen="record" aria-current="page">記録</button>
  <button type="button" class="tab" data-screen="graph">グラフ</button>
</nav>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
